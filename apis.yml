aid: insta360
name: Insta360
description: >-
  Insta360 (Arashi Vision Co., Ltd) is a consumer and professional imaging company best known for its
  360-degree and action cameras (the X, GO, ACE, Link, and Pro/Titan lines). For developers, Insta360
  runs a first-party developer program through its Insta360Develop GitHub organization and a VitePress
  developer-documentation site. Cameras expose on-device HTTP control APIs: consumer models implement
  Google's Open Spherical Camera (OSC) API over the camera Wi-Fi AP, and the Pro/Titan line adds a
  JSON-over-HTTP command API (ProCameraApi) for capture, live streaming, and file access. Native SDKs
  wrap this surface for C++ (camera control and media stitching/editing), Android, and iOS so third-party
  apps can connect to, configure, capture from, and post-process footage from Insta360 hardware.
