apis:
- name: Insta360 OSC API
  description: >-
    On-device HTTP/JSON control API for Insta360 consumer 360 cameras (ONE X/X2/X3/X4/X5, ONE R/RS),
    implemented on Google's Open Spherical Camera (OSC) standard. The camera runs a built-in HTTP server
    reachable at 192.168.42.1 when a client is connected to the camera's Wi-Fi access point.
  humanURL: https://insta360develop.github.io/Insta360-Developer_Docs/
  baseURL: http://192.168.42.1/osc/
  tags:
  - Camera
  - 360 Video
  - Open Spherical Camera
  tags_raw:
