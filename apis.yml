    url: https://github.com/Insta360Develop/Insta360_OSC
  - type: APIReference
    url: https://insta360develop.github.io/Insta360-Developer_Docs/
- name: Insta360 Pro Camera API
  description: >-
    JSON-over-HTTP command API for Insta360 Pro, Pro 2, and Titan professional 360 cameras. Commands are
    issued to the camera's built-in HTTP server (osc/commands/execute, osc/state) with file access and an
    RTMP preview stream; the camera IP is shown on the device screen.
  humanURL: https://github.com/Insta360Develop/ProCameraApi
