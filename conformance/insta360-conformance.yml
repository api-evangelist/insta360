notes: >-
  Insta360 consumer 360 cameras (ONE X/X2/X3/X4/X5, ONE R/RS) implement an HTTP
  control API built on Google's Open Spherical Camera (OSC) API standard. The
  Insta360 Pro / Pro 2 / Titan line exposes a separate JSON-over-HTTP command
  API (ProCameraApi) modeled on OSC command semantics (osc/commands/execute,
  osc/state). Both are on-device HTTP servers reached over the camera's Wi-Fi AP.
